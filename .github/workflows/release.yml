# Build the portable Windows zip when a version tag is pushed (v1.2.3) and
# attach it to a GitHub Release for that tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pygoals-win64
          path: dist/pygoals-*-win64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pygoals-*-win64.zip
