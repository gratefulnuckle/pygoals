# pygoals settings. Edit here or from the tray: Settings.
# Precedence: command-line flags > environment/.env > this file > defaults.

# Brightcove player policy key. BRIGHTCOVE_PK in the environment or .env overrides this.
[brightcove]
policy_key = 

# Active Chromecast. Set from the Devices page; uuid is matched first, then name, then host.
[device]
name = 
uuid = 
host = 
known_hosts = 

# poll_seconds: 5-3600. card_mode: video (card plays as a short clip right before the goal, seamless), image (still card; the receiver restarts before the goal) or off. card_seconds: 0-30 (video cards last at least 1 s). quality: auto, hls:<height>, mp4:<height> or hls:adaptive (pick it in Settings). max_height: cap for auto, 240-2160.
[playback]
poll_seconds = 60
card_seconds = 4
quality = auto
max_height = 1080
card_mode = video
remember_seen = true

# Which Cast receiver plays the goals. receiver_mode: auto (pygoals receiver if receiver_app_id is set and it launches, else the default receiver), custom (always the pygoals receiver) or default. receiver_app_id: Cast app ID of the pygoals receiver (7B4ABD0E; unpublished for now, so it only launches on registered test devices and auto falls back to the default receiver); blank = never use it. video_overlay: show title text over the goal video (receiver lower third / cast title); off = clean video.
[cast]
receiver_mode = auto
receiver_app_id = 7B4ABD0E
video_overlay = false

# LAN port the TV fetches player cards from. Keep it fixed (default 8765) so one firewall rule covers it; 0 = random port each run.
[server]
port = 8765

# Media bar position. snap_to_tray = true ignores bar_x/bar_y and anchors above the tray icon.
[ui]
snap_to_tray = true
bar_x = 
bar_y = 
show_bar_on_start = true

# Dark toast notifications above the tray. toast_seconds: 2-60.
[notifications]
goals = true
errors = true
toast_seconds = 6

# level: DEBUG, INFO, WARNING or ERROR. Logs go to ./logs/pygoals.log.
[logging]
level = INFO
to_file = true

